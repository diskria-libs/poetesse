[versions]
kotlin-poet = "2.3.0"
java-poet = "0.19.0"

[libraries]
kotlin-poet = { group = "com.squareup", name = "kotlinpoet", version.ref = "kotlin-poet" }
java-poet = { group = "com.palantir.javapoet", name = "javapoet", version.ref = "java-poet" }

[bundles]
poets = [
    "kotlin-poet",
    "java-poet",
]

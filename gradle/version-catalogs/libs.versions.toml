[versions]
projektor = "6.+"
kotlin-poet = "2.3.0"
java-poet = "0.14.0"
junit = "6.0.3"

[plugins]
projektor = { id = "io.github.diskria.projektor", version.ref = "projektor" }

[libraries]
kotlin-poet = { group = "com.squareup", name = "kotlinpoet", version.ref = "kotlin-poet" }
java-poet = { group = "com.palantir.javapoet", name = "javapoet", version.ref = "java-poet" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }

[bundles]
poets = [
    "kotlin-poet",
    "java-poet",
]
